server {
  client_max_body_size 1G;

  listen 80 default_server;

  server_name localhost;

  location /grip/ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_connect_timeout 1h;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;
    proxy_pass http://pushpin:7999/ws;
  }

  # Alias minio in case minio container is not present
  set $minio http://minio:9000;
  location /minio/ {
    rewrite ^/minio/(.*)$ /$1 break;
    proxy_pass $minio;
  }

  location /api/ {
    proxy_pass http://api:3000/;
  }

  # Filesystem image URLs are relative, so the browser resolves them under /app/
  location /app/api/ {
    proxy_pass http://api:3000/;
  }

  location = / {
    return 301 /app/;
  }

  location = /app {
    return 301 /app/;
  }

  location /app/ {
    proxy_pass http://static:80/;

    # Fall back to index.html so deep links work
    proxy_intercept_errors on;
    error_page 404 = @app_fallback;
  }

  location @app_fallback {
    rewrite ^ /index.html break;
    proxy_pass http://static:80;
  }
}
